<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuadrante Anual Laboral - Corregido</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #f1f5f9; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity: 1; }
    select option { background: #fff; color: #1E293B; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const TIPOS = [
      { id: "jornada",    label: "Jornada",           emoji: "💼", color: "#DC2626", bg: "#FEF2F2", text: "#991B1B", border: "#FECACA" },
      { id: "vacaciones", label: "Vacaciones",         emoji: "🏖️", color: "#CA8A04", bg: "#FEFCE8", text: "#713F12", border: "#FDE047", diaCompleto: true },
      { id: "asuntos",    label: "Asuntos propios",    emoji: "📋", color: "#7C3AED", bg: "#F5F3FF", text: "#4C1D95", border: "#DDD6FE" },
      { id: "excesos",    label: "Excesos",            emoji: "⏱️", color: "#0891B2", bg: "#ECFEFF", text: "#164E63", border: "#A5F3FC" },
      { id: "sindical",   label: "Días Sindicales",    emoji: "✊", color: "#9333EA", bg: "#FAF5FF", text: "#581C87", border: "#E9D5FF" },
      { id: "guardia",    label: "Guardia",            emoji: "🛡️", color: "#D97706", bg: "#FFFBEB", text: "#92400E", border: "#FDE68A" },
      { id: "refuerzo",   label: "Refuerzo",           emoji: "⚡", color: "#B45309", bg: "#FEF3C7", text: "#78350F", border: "#FDE68A" },
      { id: "permiso",    label: "Permiso",            emoji: "📝", color: "#DB2777", bg: "#FDF2F8", text: "#9D174D", border: "#FBCFE8" },
      { id: "baja",       label: "Baja médica",        emoji: "🏥", color: "#EA580C", bg: "#FFF7ED", text: "#9A3412", border: "#FED7AA" },
      { id: "festivo",    label: "Festivo",            emoji: "🎉", color: "#0891B2", bg: "#ECFEFF", text: "#164E63", border: "#A5F3FC" },
      { id: "libre",      label: "Libre / Descanso",   emoji: "☕", color: "#16A34A", bg: "#F0FDF4", text: "#14532D", border: "#86EFAC" },
    ];

    // Funciones auxiliares
    const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
    const toDateKey = (y, m, d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [year] = useState(2024);
      const [selected, setSelected] = useState({});
      const [meta, setMeta] = useState({});
      const [showVacaciones, setShowVacaciones] = useState(false);

      // CORRECCIÓN LÓGICA VACACIONES: Marca todos los días del rango
      const aplicarVacaciones = (ranges) => {
        const newSelected = { ...selected };
        const newMeta = { ...meta };

        ranges.forEach(rng => {
          let cur = new Date(year, rng.sm, rng.sd);
          const end = new Date(year, rng.em, rng.ed);
          
          while (cur <= end) {
            const dk = toDateKey(year, cur.getMonth(), cur.getDate());
            // Guardamos si originalmente era día de trabajo para el conteo de jornadas
            const eraTrabajo = (newSelected[dk]?.jornada || 0) > 0;
            
            newSelected[dk] = { ...newSelected[dk], vacaciones: 24 };
            newMeta[dk] = { ...newMeta[dk], era_trabajo: eraTrabajo };
            
            // Si es vacaciones, quitamos la jornada laboral visualmente
            delete newSelected[dk].jornada;
            
            cur.setDate(cur.getDate() + 1);
          }
        });

        setSelected(newSelected);
        setMeta(newMeta);
        setShowVacaciones(false);
      };

      // Simulación de guardado de excesos corregido en el modal de día
      const guardarDia = (dk, horasDia, metaDia) => {
        setSelected(prev => ({ ...prev, [dk]: horasDia }));
        setMeta(prev => ({ ...prev, [dk]: metaDia }));
      };

      return (
        <div style={{ padding: 20 }}>
          <h1>Cuadrante Laboral</h1>
          <button onClick={() => setShowVacaciones(true)} style={{ padding: 10, margin: "10px 0", cursor: "pointer" }}>
            🏖️ Planificar Vacaciones
          </button>

          {showVacaciones && (
            <VacacionesModal 
              year={year} 
              selected={selected} 
              onClose={() => setShowVacaciones(false)} 
              onApply={aplicarVacaciones} 
            />
          )}
          
          <p>Días con datos: {Object.keys(selected).length}</p>
          {/* Aquí iría el resto del calendario */}
        </div>
      );
    }

    // --- MODAL DE VACACIONES ---
    function VacacionesModal({ year, selected, onClose, onApply }) {
      const [ranges, setRanges] = useState([{ sm: 0, sd: 1, em: 0, ed: 7 }]);
      
      const upd = (i, k, v) => setRanges(r => r.map((rng, idx) => idx === i ? { ...rng, [k]: +v } : rng));

      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ background: "#fff", padding: 24, borderRadius: 16, width: 400 }}>
            <h3>Planificar Periodo</h3>
            {ranges.map((rng, i) => (
              <div key={i} style={{ marginBottom: 15, borderBottom: "1px solid #eee", paddingBottom: 10 }}>
                <label>Desde:</label>
                <input type="number" value={rng.sd} onChange={e => upd(i, "sd", e.target.value)} style={{ width: 50 }} />
                <label> Mes: </label>
                <input type="number" value={rng.sm + 1} onChange={e => upd(i, "sm", e.target.value - 1)} style={{ width: 50 }} />
                <br/>
                <label>Hasta:</label>
                <input type="number" value={rng.ed} onChange={e => upd(i, "ed", e.target.value)} style={{ width: 50 }} />
                <label> Mes: </label>
                <input type="number" value={rng.em + 1} onChange={e => upd(i, "em", e.target.value - 1)} style={{ width: 50 }} />
              </div>
            ))}
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button onClick={onClose}>Cancelar</button>
              <button onClick={() => onApply(ranges)} style={{ background: "#CA8A04", color: "#fff", border: "none", padding: "8px 16px", borderRadius: 8 }}>
                Aplicar a todos los días
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
