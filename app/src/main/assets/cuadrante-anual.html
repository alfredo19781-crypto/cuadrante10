<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuadrante Alfredo V7 - Pro</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --primary: #2563EB; --danger: #EF4444; --success: #22C55E; --dark: #1E293B; --bg: #F8FAFC; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--dark); padding: 10px; padding-bottom: 80px; }
    
    .card { background: white; border-radius: 16px; border: 1px solid #E2E8F0; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .grid-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    button { cursor: pointer; border: none; transition: 0.3s; }
    
    /* Modales */
    .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
    .modal-content { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    
    /* Inputs */
    input, select { border-radius: 10px; border: 1px solid #CBD5E1; padding: 12px; width: 100%; font-size: 14px; margin-top: 5px; background: #FDFDFD; }
    label { font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Botones */
    .btn-save { background: var(--success); color: white; padding: 10px 15px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .btn-delete { background: #FEE2E2; color: var(--danger); width: 35px; height: 35px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .btn-primary { background: var(--primary); color: white; padding: 14px; border-radius: 12px; font-weight: bold; width: 100%; margin-top: 10px; }
    
    /* Estética Calendario */
    .dia-btn { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; border: 1px solid #F1F5F9; background: white; position: relative; }
    .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 5px; }
    .badge { position: absolute; top: -3px; right: -3px; padding: 2px 5px; border-radius: 6px; font-size: 8px; font-weight: 800; color: white; }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F1F5F9; padding-bottom: 8px; margin-bottom: 12px; }
    .section-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: var(--dark); }
    .row-item { display: flex; justify-content: space-between; align-items: center; background: #F8FAFC; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #F1F5F9; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const DIAS_L = ["L","M","X","J","V","S","D"];
    const toDateKey = (y, m, d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    function App() {
      const [year, setYear] = useState(2026);
      const [selected, setSelected] = useState(() => JSON.parse(localStorage.getItem("cuad_alfredo_v7") || "{}"));
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem("user_alfredo_v7") || '{"nombre":"Alfredo","ingreso":2010,"periodos":[]}'));
      const [edit, setEdit] = useState(null);
      const [showGear, setShowGear] = useState(false);

      useEffect(() => { localStorage.setItem("cuad_alfredo_v7", JSON.stringify(selected)); }, [selected]);
      useEffect(() => { localStorage.setItem("user_alfredo_v7", JSON.stringify(user)); }, [user]);

      const antiguedad = year - user.ingreso;
      const extraVacas = antiguedad >= 30 ? 4 : antiguedad >= 25 ? 3 : antiguedad >= 20 ? 2 : antiguedad >= 15 ? 1 : 0;
      const jornadasObj = 193 - extraVacas;
      const isVacation = (dk) => user.periodos.some(p => dk >= p.inicio && dk <= p.fin);

      // Agrupación de datos para la configuración
      const logs = useMemo(() => {
        let results = { asuntos: [], sindical: [], jornada: [], mesSindical: Array(12).fill(0), jTotal: 0 };
        Object.entries(selected).sort().forEach(([dk, data]) => {
          if(!dk.startsWith(year.toString())) return;
          const mIdx = new Date(dk).getMonth();
          if(data.asuntos) results.asuntos.push({dk, ...data});
          if(data.sindical) {
            results.sindical.push({dk, ...data});
            results.mesSindical[mIdx] += data.sindical;
          }
          if(data.jornada && !isVacation(dk)) {
            results.jTotal += data.jornada / 8;
          }
        });
        return results;
      }, [selected, year, user.periodos]);

      const deleteRegistro = (dk, tipo) => {
        const newS = {...selected};
        if(tipo === 'all') delete newS[dk];
        else if(newS[dk]) delete newS[dk][tipo];
        setSelected(newS);
      };

      const aplicarCiclo = () => {
        const start = new Date(document.getElementById('cStart').value);
        const h = parseInt(document.getElementById('cHoras').value);
        const dw = parseInt(document.getElementById('cDW').value);
        const dd = parseInt(document.getElementById('cDD').value);
        let newS = {...selected};
        let curr = new Date(start);
        while(curr.getFullYear() <= year) {
          for(let i=0; i<dw; i++){ if(curr.getFullYear()===year) newS[toDateKey(year, curr.getMonth(), curr.getDate())] = {jornada: h}; curr.setDate(curr.getDate()+1); }
          for(let i=0; i<dd; i++){ if(curr.getFullYear()===year) newS[toDateKey(year, curr.getMonth(), curr.getDate())] = {descanso: true}; curr.setDate(curr.getDate()+1); }
        }
        setSelected(newS);
      };

      return (
        <div>
          <div className="header-app">
            <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
              <div style={{width:'45px', height:'45px', background: 'var(--primary)', borderRadius:'12px', display:'flex', alignItems:'center', justifyCenter:'center', color:'white', fontSize:'20px'}}>
                <i className="fa-solid fa-calendar-check" style={{margin:'auto'}}></i>
              </div>
              <div>
                <h1 style={{fontSize:'18px', fontWeight:900}}>{user.nombre}</h1>
                <p style={{fontSize:'11px', fontWeight:600, opacity:0.5}}>CUADRANTE {year}</p>
              </div>
            </div>
            <button onClick={() => setShowGear(true)} style={{width:'45px', height:'45px', background:'white', borderRadius:'12px', border:'1px solid #E2E8F0', fontSize:'18px', color: 'var(--dark)'}}>
              <i className="fa-solid fa-gear"></i>
            </button>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'10px', marginBottom:'15px'}}>
             <div className="card" style={{margin:0, textAlign:'center', background:'var(--dark)', color:'white'}}>
                <label style={{color:'#94A3B8', fontSize:'9px'}}>OBJETIVO</label>
                <div style={{fontSize:'16px', fontWeight:800}}>{jornadasObj}</div>
             </div>
             <div className="card" style={{margin:0, textAlign:'center'}}>
                <label style={{fontSize:'9px'}}>REALIZADO</label>
                <div style={{fontSize:'16px', fontWeight:800}}>{logs.jTotal.toFixed(1)}</div>
             </div>
             <div className="card" style={{margin:0, textAlign:'center', background: logs.jTotal-jornadasObj >= 0 ? '#DCFCE7' : '#FEE2E2'}}>
                <label style={{fontSize:'9px'}}>BALANCE</label>
                <div style={{fontSize:'16px', fontWeight:800}}>{(logs.jTotal - jornadasObj).toFixed(1)}</div>
             </div>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(320px, 1fr))', gap:'15px'}}>
            {MESES.map((nombre, mi) => (
              <div key={mi} className="card">
                <div className="section-header">
                  <span className="section-title" style={{color:'var(--primary)'}}>{nombre.toUpperCase()}</span>
                  {logs.mesSindical[mi] > 0 && <span style={{fontSize:'10px', fontWeight:700, color: logs.mesSindical[mi] >= 20 ? 'var(--danger)' : 'var(--primary)'}}>SIND: {logs.mesSindical[mi]}h/20</span>}
                </div>
                <div className="grid-cal">
                  {DIAS_L.map(l => <div key={l} style={{textAlign:'center', fontSize:'10px', fontWeight:700, opacity:0.3}}>{l}</div>)}
                  {Array(new Date(year, mi, 1).getDay() === 0 ? 6 : new Date(year, mi, 1).getDay() - 1).fill(0).map((_, i) => <div key={i} />)}
                  {Array.from({ length: new Date(year, mi + 1, 0).getDate() }, (_, i) => i + 1).map(d => {
                    const dk = toDateKey(year, mi, d);
                    const data = selected[dk] || {};
                    const vacas = isVacation(dk);
                    let bg = "white";
                    if(vacas) bg = "#FEF9C3";
                    else if(data.jornada) bg = "#FEE2E2";
                    else if(data.descanso) bg = "#DCFCE7";
                    else if(data.asuntos || data.sindical) bg = "#F5F3FF";

                    return (
                      <button key={dk} onClick={() => setEdit({ dk, data })} className="dia-btn" style={{ background: bg }}>
                        <span style={{fontWeight:700}}>{d}</span>
                        {data.jornada > 0 && !vacas && <span style={{fontSize:'8px', color:'var(--danger)', fontWeight:900}}>{data.jornada}h</span>}
                        {data.sindical > 0 && <div className="badge" style={{background:'#8B5CF6'}}>{data.sindical}h</div>}
                        {data.asuntos && <div className="badge" style={{background:'#F59E0B', right:'auto', left:'-3px'}}>A</div>}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* CONFIGURACIÓN REDISEÑADA */}
          {showGear && (
            <div className="modal" onClick={() => setShowGear(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="section-header">
                  <h2 className="section-title"><i className="fa-solid fa-sliders"></i> CONFIGURACIÓN</h2>
                  <button onClick={() => setShowGear(false)} style={{fontSize:'20px', color:'#64748B'}}><i className="fa-solid fa-xmark"></i></button>
                </div>

                {/* SECCIÓN FICHA */}
                <div className="card">
                   <div className="section-header">
                      <span className="section-title"><i className="fa-solid fa-id-card"></i> FICHA PERSONAL</span>
                      <button className="btn-save" onClick={() => setShowGear(false)}>GUARDAR</button>
                   </div>
                   <label>Nombre</label>
                   <input type="text" value={user.nombre} onChange={e => setUser({...user, nombre: e.target.value})} />
                   <label>Año Ingreso</label>
                   <input type="number" value={user.ingreso} onChange={e => setUser({...user, ingreso: parseInt(e.target.value)})} />
                </div>

                {/* SECCIÓN CICLO */}
                <div className="card">
                   <div className="section-header">
                      <span className="section-title"><i className="fa-solid fa-rotate"></i> CICLO TRABAJO</span>
                      <button className="btn-save" onClick={aplicarCiclo} style={{background:'var(--dark)'}}>APLICAR</button>
                   </div>
                   <div style={{display:'grid', gap:'8px'}}>
                     <input type="date" id="cStart" defaultValue={`${year}-01-02`} />
                     <div style={{display:'flex', gap:'5px'}}>
                       <select id="cHoras"><option value="24">24h</option><option value="12">12h</option></select>
                       <input type="number" id="cDW" placeholder="Trab." defaultValue="1" />
                       <input type="number" id="cDD" placeholder="Desc." defaultValue="4" />
                     </div>
                   </div>
                </div>

                {/* SECCIÓN VACACIONES */}
                <div className="card">
                   <div className="section-header">
                      <span className="section-title"><i className="fa-solid fa-plane"></i> VACACIONES</span>
                   </div>
                   {user.periodos.map(p => (
                     <div key={p.id} className="row-item">
                        <span style={{fontSize:'11px', fontWeight:700}}>{p.inicio} al {p.fin}</span>
                        <button onClick={() => setUser({...user, periodos: user.periodos.filter(x=>x.id!==p.id)})} className="btn-delete"><i className="fa-solid fa-trash"></i></button>
                     </div>
                   ))}
                   <button className="btn-primary" onClick={() => setUser({...user, periodos:[...user.periodos, {id:Date.now(), inicio:`${year}-08-01`, fin:`${year}-08-31`}]})}>+ AÑADIR PERIODO</button>
                </div>

                {/* SECCIÓN ASUNTOS PROPIOS */}
                <div className="card">
                   <div className="section-header">
                      <span className="section-title" style={{color:'#F59E0B'}}><i className="fa-solid fa-briefcase"></i> ASUNTOS PROPIOS</span>
                   </div>
                   {logs.asuntos.map(a => (
                     <div key={a.dk} className="row-item">
                        <span>{a.dk.split('-').reverse().join('/')}</span>
                        <button onClick={() => deleteRegistro(a.dk, 'asuntos')} className="btn-delete"><i className="fa-solid fa-trash"></i></button>
                     </div>
                   ))}
                </div>

                {/* SECCIÓN SINDICALES */}
                <div className="card">
                   <div className="section-header">
                      <span className="section-title" style={{color:'#8B5CF6'}}><i className="fa-solid fa-handshake"></i> HORAS SINDICALES</span>
                   </div>
                   {logs.sindical.map(s => (
                     <div key={s.dk} className="row-item">
                        <span>{s.dk.split('-').reverse().join('/')} - <b>{s.sindical}h</b></span>
                        <button onClick={() => deleteRegistro(s.dk, 'sindical')} className="btn-delete"><i className="fa-solid fa-trash"></i></button>
                     </div>
                   ))}
                </div>

                <button className="btn-primary" style={{background: 'var(--dark)'}} onClick={() => setShowGear(false)}>CERRAR CONFIGURACIÓN</button>
              </div>
            </div>
          )}

          {/* EDITOR DÍA */}
          {edit && (
            <div className="modal" onClick={() => setEdit(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="section-header">
                   <h3 className="section-title">DÍA {edit.dk.split('-').reverse().join('/')}</h3>
                   <button onClick={() => setEdit(null)} style={{fontSize:'20px'}}><i className="fa-solid fa-xmark"></i></button>
                </div>
                
                <div style={{display:'grid', gap:'15px'}}>
                   <div><label>💼 Horas Jornada</label>
                   <input type="number" value={edit.data.jornada || 0} onChange={e => setEdit({...edit, data: {...edit.data, jornada: parseInt(e.target.value)||0, descanso: false}})} /></div>
                   
                   <div><label>📢 Horas Sindicales (Máx 20h/mes)</label>
                   <input type="number" value={edit.data.sindical || 0} onChange={e => {
                     let v = parseInt(e.target.value) || 0;
                     const mIdx = new Date(edit.dk).getMonth();
                     const used = logs.mesSindical[mIdx] - (edit.data.sindical || 0);
                     if(used + v > 20) { alert("Límite mensual alcanzado (20h)."); v = 20 - used; }
                     setEdit({...edit, data: {...edit.data, sindical: v}});
                   }} /></div>

                   <div style={{display:'flex', gap:'15px', background:'#F1F5F9', padding:'15px', borderRadius:'12px'}}>
                      <div style={{flex:1, textAlign:'center'}}><label>📋 Asuntos</label><br/><input type="checkbox" checked={edit.data.asuntos || false} onChange={e => setEdit({...edit, data: {...edit.data, asuntos: e.target.checked}})} style={{width:'25px', height:'25px', marginTop:'10px'}} /></div>
                      <div style={{flex:1, textAlign:'center'}}><label>🏥 Baja</label><br/><input type="checkbox" checked={edit.data.baja || false} onChange={e => setEdit({...edit, data: {...edit.data, baja: e.target.checked, jornada:0}})} style={{width:'25px', height:'25px', marginTop:'10px'}} /></div>
                      <div style={{flex:1, textAlign:'center'}}><label>🌴 Descanso</label><br/><input type="checkbox" checked={edit.data.descanso || false} onChange={e => setEdit({...edit, data: {...edit.data, descanso: e.target.checked, jornada:0}})} style={{width:'25px', height:'25px', marginTop:'10px'}} /></div>
                   </div>
                </div>

                <button className="btn-primary" onClick={() => { setSelected({...selected, [edit.dk]: edit.data}); setEdit(null); }}>GUARDAR CAMBIOS</button>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
