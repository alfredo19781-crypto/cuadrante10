<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuadrante Alfredo V8</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --primary: #2563EB; --danger: #EF4444; --success: #22C55E; --dark: #1E293B; --bg: #F8FAFC; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--dark); padding: 10px; }
    .card { background: white; border-radius: 16px; border: 1px solid #E2E8F0; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .grid-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    button { cursor: pointer; border: none; transition: 0.3s; }
    .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
    .modal-content { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    select, input { border-radius: 8px; border: 1px solid #CBD5E1; padding: 8px; font-size: 14px; background: #FDFDFD; }
    label { font-size: 10px; font-weight: 700; color: #64748B; text-transform: uppercase; display: block; margin-bottom: 2px; }
    .btn-primary { background: var(--primary); color: white; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; }
    .dia-btn { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; border: 1px solid #F1F5F9; background: white; position: relative; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #F1F5F9; padding-bottom: 5px; }
    .vaca-row { display: flex; align-items: flex-end; gap: 4px; background: #F8FAFC; padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid #E2E8F0; }
    .vaca-group { display: flex; flex-direction: column; flex: 1; }
    .btn-mini-del { background: var(--danger); color: white; width: 30px; height: 35px; border-radius: 6px; }
    .btn-mini-apply { background: var(--success); color: white; padding: 0 10px; height: 35px; border-radius: 6px; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const DIAS_L = ["L","M","X","J","V","S","D"];
    const toDateKey = (y, m, d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    function App() {
      const [year, setYear] = useState(2026);
      const [selected, setSelected] = useState(() => JSON.parse(localStorage.getItem("cuad_alfredo_v8") || "{}"));
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem("user_alfredo_v8") || '{"nombre":"Alfredo","ingreso":2008,"periodos":[]}'));
      const [showGear, setShowGear] = useState(false);
      const [edit, setEdit] = useState(null);

      useEffect(() => { localStorage.setItem("cuad_alfredo_v8", JSON.stringify(selected)); }, [selected]);
      useEffect(() => { localStorage.setItem("user_alfredo_v8", JSON.stringify(user)); }, [user]);

      const antiguedad = year - user.ingreso;
      const extraVacas = antiguedad >= 30 ? 4 : antiguedad >= 25 ? 3 : antiguedad >= 20 ? 2 : antiguedad >= 15 ? 1 : 0;
      const jornadasObj = 193 - extraVacas;

      const isVacation = (dk) => {
        return user.periodos.some(p => {
          const inicio = `${year}-${String(p.mIni).padStart(2,'0')}-${String(p.dIni).padStart(2,'0')}`;
          const fin = `${year}-${String(p.mFin).padStart(2,'0')}-${String(p.dFin).padStart(2,'0')}`;
          return dk >= inicio && dk <= fin;
        });
      };

      const jTotal = useMemo(() => {
        return Object.entries(selected).reduce((acc, [dk, data]) => {
          if(dk.startsWith(year.toString()) && data.jornada && !isVacation(dk)) return acc + (data.jornada/8);
          return acc;
        }, 0);
      }, [selected, year, user.periodos]);

      const updatePeriodo = (id, campo, valor) => {
        const nuevos = user.periodos.map(p => p.id === id ? {...p, [campo]: parseInt(valor)} : p);
        setUser({...user, periodos: nuevos});
      };

      const aplicarCiclo = () => {
        const start = new Date(document.getElementById('cStart').value);
        const h = parseInt(document.getElementById('cHoras').value);
        const dw = parseInt(document.getElementById('cDW').value);
        const dd = parseInt(document.getElementById('cDD').value);
        let newS = {...selected};
        let curr = new Date(start);
        while(curr.getFullYear() <= year) {
          const dk = toDateKey(year, curr.getMonth(), curr.getDate());
          if(curr.getFullYear() === year) {
            for(let i=0; i<dw; i++){ 
               const d = toDateKey(year, curr.getMonth(), curr.getDate());
               if(curr.getFullYear()===year) newS[d] = {jornada: h}; 
               curr.setDate(curr.getDate()+1); 
            }
            for(let i=0; i<dd; i++){ 
               const d = toDateKey(year, curr.getMonth(), curr.getDate());
               if(curr.getFullYear()===year) newS[d] = {descanso: true}; 
               curr.setDate(curr.getDate()+1); 
            }
          } else { curr.setDate(curr.getDate()+1); }
        }
        setSelected(newS);
        alert("Patrón aplicado");
      };

      return (
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px'}}>
            <h1 style={{fontSize:'18px'}}>📅 Cuadrante {user.nombre}</h1>
            <button onClick={() => setShowGear(true)} style={{fontSize:'20px', background:'none'}}><i className="fa-solid fa-gear"></i></button>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'10px', marginBottom:'15px'}}>
            <div className="card" style={{margin:0, textAlign:'center'}}>
              <label>Objetivo</label><b>{jornadasObj}</b>
            </div>
            <div className="card" style={{margin:0, textAlign:'center'}}>
              <label>Real</label><b>{jTotal.toFixed(1)}</b>
            </div>
            <div className="card" style={{margin:0, textAlign:'center', background: (jTotal-jornadasObj)>=0 ? '#DCFCE7':'#FEE2E2'}}>
              <label>Balance</label><b>{(jTotal - jornadasObj).toFixed(1)}</b>
            </div>
          </div>

          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(300px, 1fr))', gap:'10px'}}>
            {MESES.map((nombre, mi) => (
              <div key={mi} className="card">
                <h4 style={{color:'var(--primary)', marginBottom:'5px'}}>{nombre}</h4>
                <div className="grid-cal">
                  {DIAS_L.map(l => <div key={l} style={{fontSize:'10px', opacity:0.4, textAlign:'center'}}>{l}</div>)}
                  {Array(new Date(year, mi, 1).getDay() === 0 ? 6 : new Date(year, mi, 1).getDay() - 1).fill(0).map((_, i) => <div key={i} />)}
                  {Array.from({ length: new Date(year, mi + 1, 0).getDate() }, (_, i) => i + 1).map(d => {
                    const dk = toDateKey(year, mi, d);
                    const data = selected[dk] || {};
                    const vacas = isVacation(dk);
                    let bg = vacas ? "#FEF9C3" : (data.jornada ? "#FEE2E2" : (data.descanso ? "#DCFCE7" : "white"));
                    return (
                      <button key={dk} className="dia-btn" style={{background: bg}} onClick={() => setEdit({dk, data})}>
                        {d}
                        {data.jornada > 0 && !vacas && <span style={{fontSize:'8px', color:'red'}}>{data.jornada}h</span>}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {showGear && (
            <div className="modal" onClick={() => setShowGear(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="section-header"><h2>Configuración</h2><button onClick={() => setShowGear(false)}>X</button></div>
                
                {/* FICHA */}
                <div className="card">
                  <label>Nombre</label>
                  <input type="text" value={user.nombre} onChange={e => setUser({...user, nombre: e.target.value})} />
                  <label>Año de Ingreso</label>
                  <input type="number" value={user.ingreso} onChange={e => setUser({...user, ingreso: parseInt(e.target.value)})} />
                </div>

                {/* VACACIONES */}
                <div className="card">
                  <div className="section-header"><span style={{fontWeight:'bold'}}>🏖️ VACACIONES</span></div>
                  {user.periodos.map(p => (
                    <div key={p.id} className="vaca-row">
                      <div className="vaca-group">
                        <label>Inicio</label>
                        <div style={{display:'flex', gap:'2px'}}>
                          <select value={p.mIni} onChange={e => updatePeriodo(p.id, 'mIni', e.target.value)}>
                            {MESES.map((m, i) => <option key={i} value={i+1}>{m.slice(0,3)}</option>)}
                          </select>
                          <input type="number" style={{width:'45px'}} value={p.dIni} onChange={e => updatePeriodo(p.id, 'dIni', e.target.value)} />
                        </div>
                      </div>
                      <div style={{paddingBottom:'10px'}}>A</div>
                      <div className="vaca-group">
                        <label>Fin</label>
                        <div style={{display:'flex', gap:'2px'}}>
                          <select value={p.mFin} onChange={e => updatePeriodo(p.id, 'mFin', e.target.value)}>
                            {MESES.map((m, i) => <option key={i} value={i+1}>{m.slice(0,3)}</option>)}
                          </select>
                          <input type="number" style={{width:'45px'}} value={p.dFin} onChange={e => updatePeriodo(p.id, 'dFin', e.target.value)} />
                        </div>
                      </div>
                      <button className="btn-mini-apply" onClick={() => { alert("Periodo guardado. El calendario se actualizará."); setShowGear(false); }}>APLICAR</button>
                      <button className="btn-mini-del" onClick={() => setUser({...user, periodos: user.periodos.filter(x => x.id !== p.id)})}>X</button>
                    </div>
                  ))}
                  <button className="btn-primary" style={{fontSize:'12px'}} onClick={() => setUser({...user, periodos: [...user.periodos, {id:Date.now(), dIni:1, mIni:8, dFin:31, mFin:8}]})}>+ AÑADIR PERIODO</button>
                </div>

                {/* CICLO */}
                <div className="card">
                  <div className="section-header"><span style={{fontWeight:'bold'}}>🔄 CICLO TRABAJO</span></div>
                  <input type="date" id="cStart" defaultValue={`${year}-01-02`} />
                  <div style={{display:'flex', gap:'5px', marginTop:'5px'}}>
                    <select id="cHoras"><option value="24">24h</option><option value="12">12h</option></select>
                    <input type="number" id="cDW" placeholder="Trab." defaultValue="1" />
                    <input type="number" id="cDD" placeholder="Desc." defaultValue="4" />
                  </div>
                  <button className="btn-primary" style={{marginTop:'10px', background: 'var(--dark)'}} onClick={aplicarCiclo}>APLICAR CICLO</button>
                </div>

                <button className="btn-primary" onClick={() => setShowGear(false)} style={{marginTop:'10px'}}>CERRAR</button>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
