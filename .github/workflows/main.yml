name: Compilar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ESTE PASO DESCARGA EL ARCHIVO QUE TE FALTA
      - name: Instalar Gradle Wrapper
        run: gradle wrapper

      - name: Dar permiso a gradlew
        run: chmod +x gradlew

      - name: Crear APK Debug
        run: ./gradlew assembleDebug

      - name: Subir APK terminada
        uses: actions/upload-artifact@v4
        with:
          name: MiAplicacion
          path: app/build/outputs/apk/debug/*.apk
